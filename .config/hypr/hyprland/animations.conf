#https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes
    
    # Animation curves
    bezier = linear, 0, 0, 1, 1
    bezier = overshot, 0.01, 0.9, 0.5, 1.1
    bezier = overshot-slow, 0.01, 0.7, 0.01, 0.5
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = easeOutCubic, 0.33, 1, 0.68, 1

    # Animation configs
    animation = windows, 1, 3, overshot, slide
    animation = windowsIn, 1, 2, emphasizedDecel, slide
    animation = windowsOut, 1, 8, easeOutCubic, popin 40% 
    animation = border, 1, 10, default
    animation = fade, 1, 0.1, default
    animation = fadeOut,    1, 8, default
    animation = fadeLayersIn, 1, 2, overshot
    animation = fadeLayersOut, 1, 0.5, overshot
    animation = layers, 1, 1.5, overshot, slide
    animation = layersIn, 1, 1, overshot, slide top
    animation = layersOut, 1, 1, default
    animation = workspaces, 1, 2, overshot, slide
    animation = specialWorkspace, 1, 3, overshot, slidefadevert
}