# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    active_opacity = 1
    inactive_opacity = 0.9
    fullscreen_opacity = 1
# https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        xray = true
        popups = true

    }

    shadow {
        enabled = true
        range = 10
        render_power = 4
        sharp = false
        ignore_window = true
        color = $backgroundCol # Hauptfarbe des Schattens
        scale = 10.0 # Standard-Skalierung
    }
}