# You can put your preferred keybinds here
# https://wiki.hyprland.org/Configuring/Binds/

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod, C, killactive,w
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, H, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen
bind = $mainMod, G, fullscreen, 1



# Custom Keybinds
bind = $mainMod, escape, exec, wlogout
bind = $mainMod, L, exec, bash ~/.config/hypr/hyprlock/hyprlock.sh
bind = $mainMod, Z, exec, $browser
bind = CTRL ALT, C, exec, flatpak run sh.cider.Cider 
bind = $mainMod SHIFT, S, exec, hyprshot -m region output --clipboard-only # screenshot into clipboard
bind = $mainMod, PRINT, exec, hyprshot -m region output --clipboard-only # screenshot into clipboard
bind = $mainMod, V, exec, cliphist list | wofi -S dmenu -n | cliphist decode | wl-copy
bind = $mainMod, W, exec, bash ~/.config/hypr/wallpapers/switch_wallpaper.sh
bind = $mainMod, B, exec, better-control
bind = $mainMod, TAB, exec,swaync-client -t -sw
bind = $mainMod SHIFT, T, exec, bash ~/.config/custom/scripts/tailscale-toggle.sh
bind = $mainMod, X, exec, hyprctl kill


#plugins
# bind = $mainMod, X, hyprexpo:expo, toggle # can be: toggle, off/disable or on/enable
#bind = $mainMod, Section, overview:toggle, toggle

###########
# submaps #
###########

# Enter the passthrough submap with SUPER + .
bind = SUPER, PERIOD, submap, passthrough

# Define the passthrough submap
submap = passthrough

# In here, only define the exit binding
bind = SUPER, PERIOD, submap, reset

# Reset goes back to the default keymap
submap = reset

###########
# Windows #
###########

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod, section, workspace, emptyn

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10
bind = $mainMod SHIFT, section, movetoworkspace, emptyn
# Move active window to a workspace without moving
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10
bind = $mainMod CTRL, section, movetoworkspacesilent, emptyn

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


# vnc
# bind = SUPER, COMMA , exec, sh -c "wayvncctl output-set DP-1"
# bind = SUPER, PERIOD , exec, sh -c "wayvncctl output-set HDMI-A-1"
# bind = SUPER, MINUS , exec, sh -c "wayvncctl output-set HEADLESS-2"


# Custom Desktop
bind = $mainMod, d, workspace, name:default