
# #######################################################################################
# AUTOGENERATED HYPR CONFIG.
# PLEASE USE THE CONFIG PROVIDED IN THE GIT REPO /examples/hypr.conf AND EDIT IT,
# OR EDIT THIS ONE ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################


# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/Configuring-Hyprland/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf
source = /home/$USER/.cache/wal/colors-hyprland

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1, 1920x1080@165, 0x0, 1
monitor=HDMI-A-1, 1920x1080@75, 1920x0, 1
#monitor=HEADLESS-2,1920x1080@60,300x1080,1.5
# monitor=eDP-1, 1920x1200@60, 0x0, 1.5
# monitor=DP-5, 1920x1080@75, 3840x0, 1
# monitor=DP-6, 1920x1080@165, 1920x0, 1
# monitor=DP-3, 1920x1080@75, 3840x0, 1
# monitor=DP-4, 1920x1080@165, 1920x0, 1
# VMware Virtual Machine
# monitor=Virtual-1, 1718x920@60 0x0, 1
# Federi
# monitor=DP-5, 2560x1440@75, 1920x0, 1
# monitor=DP-4, 2560x1440@75, 4480x0, 1
# TV
#monitor=HDMI-A-1, 3840x2160@60, 1920x0, 2

################
### XWayland ###
################

### unscale XWayland ###
xwayland {
  force_zero_scaling = true
}
### toolkit-specific scale ###
# env = GDK_SCALE,2
# env = XCURSOR_SIZE,32

###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = thunar
$menu = wofi --show drun -n
$browser = zen-browser


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = hyprctl setcursor Bibata-Modern-Ice 24 # cursor
exec-once = swaync & waybar & swww-daemon
exec-once = wl-paste --watch cliphist store
exec-once = ~/.config/hypr/wallpapers/reload_wallpaper.sh
# ensure plugins (and their dispatchers) are loaded before binds
exec-once = /usr/bin/pypr
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = QT_QPA_PLATFORMTHEME,qt6ct

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = $color9
    col.inactive_border = $color5
    #col.active_border = rgba(505050ee) rgba(707070ee) 45deg  # Purple to Pink with 45-degree gradient
    #col.inactive_border = rgba(595959aa)


    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 4
    active_opacity = 0.9
    inactive_opacity = 0.7
    fullscreen_opacity = 1
# https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true
        blurls = waybar
        blurls = wofi
        blurls = swaync-control-center
        blurls = swaync-notification-window
    }

    shadow {
        enabled = false
        range = 4
        render_power = 3
        sharp = true
        ignore_window = true
        color = rgba(1a1a1aee) # Hauptfarbe des Schattens
        color_inactive = rgba(1a1a1a88) # Farbe für inaktive Fenster
        scale = 10.0 # Standard-Skalierung
    }
}

#https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes
    
    # Animation curves
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0.0, 0, 1.0
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.01, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92 
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1 # use with .2s duration
    bezier = win10, 0, 0, 0, 1
    bezier = gnome, 0, 0.85, 0.3, 1
    bezier = funky, 0.46, 0.35, -0.2, 1.2
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = menu_decel, 0.1, 1, 0, 1

    # Animation configs
    animation = windows, 1, 1.5, overshot, slide
    animation = windowsIn, 1, 1.5, overshot, slide
    animation = windowsOut, 1, 1.5, overshot, slide
    animation = border, 1, 10, default
    animation = fade, 1, 0.1, default
    animation = fadeLayersIn, 1, 2, overshot
    animation = fadeLayersOut, 1, 0.5, overshot
    animation = layers, 1, 1.5, overshot, slide
    animation = layersIn, 1, 1, overshot, slide top
    animation = layersOut, 1, 1, default
    animation = workspaces, 1, 2, overshot, slide
    animation = specialWorkspace, 1, 3, overshot, slidefadevert
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}

#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = ch
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    touchpad {
        natural_scroll = true
        scroll_factor = 0.15
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = true
    workspace_swipe_distance = 300
    workspace_swipe_cancel_ratio = .05
    workspace_swipe_min_speed_to_force = 0
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = 0
}

######################
### PLUGIN SETTINGS ##
######################


# Hyprexpo
plugin {
    hyprexpo {
        columns = 3
        gap_size = 5
        bg_col = rgb(000000)
        workspace_method = first 1 # [center/first] [workspace] e.g. first 1 or center m+1

        enable_gesture = false # laptop touchpad, 4 fingers
        gesture_distance = 300 # how far is the "max"
        gesture_positive = false
    }
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod, C, killactive,w
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, H, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, F, fullscreen
bind = $mainMod, G, fullscreen, 1


# Custom Keybinds
bind = $mainMod, escape, exec, wlogout
bind = $mainMod, L, exec, bash /home/arkaizn/.config/hypr/hyprlock/hyprlock.sh
bind = $mainMod, Z, exec, $browser
bind = CTRL ALT, C, exec, flatpak run sh.cider.Cider 
bind = $mainMod SHIFT, S, exec, hyprshot -m region output --clipboard-only # screenshot into clipboard
bind = $mainMod, PRINT, exec, hyprshot -m region output --clipboard-only # screenshot into clipboard
bind = $mainMod, V, exec, cliphist list | wofi -S dmenu -n | cliphist decode | wl-copy
bind = $mainMod, W, exec, bash ~/.config/hypr/wallpapers/switch_wallpaper.sh
bind = $mainMod, B, exec, ~/git/GTK-APP/files/popup.py
bind = $mainMod, TAB, exec,swaync-client -t -sw
#plugin
bind = $mainMod, Section, hyprexpo:expo, toggle # can be: toggle, off/disable or on/enable
#bind = $mainMod, X, exec, pypr expose

# # vnc submap passthrough
# bind = SUPER, P, exec, ydotool key 56:1
# bind = SUPER, P, submap, vnc_passthrough

# submap = vnc_passthrough

# bindi = alt, Escape, exec,   ydotool key 56:0
# bindi = alt, Escape, submap, reset

# bind = , catchall, pass, ^vncviewer

# submap = reset



# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Move active window to a workspace without moving
bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


# vnc
 bind = SUPER, COMMA , exec, sh -c "wayvncctl output-set DP-1"
 bind = SUPER, PERIOD , exec, sh -c "wayvncctl output-set HDMI-A-1"
 bind = SUPER, MINUS , exec, sh -c "wayvncctl output-set HEADLESS-2"



##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule v2
# windowrulev2 = float,class:^(kitty)$,title:^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
windowrulev2 = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrulev2 = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
# Custom GTK app
windowrule = float, title:^Hyprland Helper$
windowrule = monitor 1, title:^Hyprland Helper$  # Use monitor number
windowrule = move 1508 45, title:^Hyprland Helper$
windowrule = animation slide, title:^Hyprland Helper$
windowrule = animation slide:top, title:^Hyprland Helper$


# Floating and centered alacritty terminal
windowrulev2 = float, class:^(floating-center)$
windowrulev2 = center, class:^(floating-center)$

# opacity of gtk apps
windowrulev2 = opacity 0.85 0.85,class:^(gedit|nautilus|nwg-look|thunar)$




workspace = special:exposed,gapsout:60,gapsin:30,bordersize:5,border:true,shadow:false
# workspaces
#workspace = 1, monitor:DP-1
#workspace = 2, monitor:DP-1
#workspace = 3, monitor:DP-1
#workspace = 4, monitor:DP-1
#workspace = 5, monitor:DP-1
#workspace = 6, monitor:DP-1
#workspace = 7, monitor:DP-1
#workspace = 8, monitor:DP-1

layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = ignorealpha 0.5, waybar

layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = ignorealpha 0.5, wofi

layerrule = blur, swaync-control-center
layerrule = blur, swaync-notification-window
layerrule = ignorezero, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = ignorealpha 0.5, swaync-control-center
layerrule = ignorealpha 0.5, swaync-notification-window

layerrule = noanim, logout_dialog$