# Used by the quickshell lockscreen in FIDO2 mode for the typed password, next to
# u2f.conf: system-auth would ask for the key after a wrong password (and wait for
# a touch until the key times out), here a wrong password fails right away.
# Arch's default auth stack (password, faillock); in every other mode the
# lockscreen uses password.conf (= system-auth: password, or an OTP).
auth       required                    pam_faillock.so      preauth
-auth      [success=2 default=ignore]  pam_systemd_home.so
auth       [success=1 default=bad]     pam_unix.so          try_first_pass nullok nodelay
auth       [default=die]               pam_faillock.so      authfail
auth       optional                    pam_permit.so
auth       required                    pam_env.so
auth       required                    pam_faillock.so      authsucc
