# Used by the quickshell lockscreen (modules/lockscreen) in FIDO2 mode (pam_u2f in
# system-auth, set up by scripts/postinstall/yubikey.sh in the dotfiles): runs from
# the moment it locks and only waits for a touch of a YubiKey linked in
# /etc/u2f_mappings (default origin pam://$HOSTNAME, as the script registers it).
# No key plugged in: fails at once and the lockscreen starts it again.
# No pam_faillock here: those restarts and timeouts aren't failed logins.
auth required pam_u2f.so authfile=/etc/u2f_mappings
