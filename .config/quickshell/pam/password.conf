# Used by the quickshell lockscreen (modules/lockscreen) without a key or in OTP mode.
# Same auth stack as sudo/login: password, or a YubiKey OTP via pam_yubico
# (the key types the OTP + Enter into the password field). FIDO2 mode uses
# password-only.conf + u2f.conf instead (services/Yubikey.qml says which).
# PAM resolves includes inside our configDirectory, so use the absolute path.
auth include /etc/pam.d/system-auth
